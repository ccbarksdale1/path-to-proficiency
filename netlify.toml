[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

# PTP Bridge family activity pages: /home/3oa7 etc.
[[redirects]]
  from = "/home/*"
  to = "/home/index.html"
  status = 200

# Log in with Clever comes back to /clever?code=… ; the app handles it
[[redirects]]
  from = "/clever"
  to = "/index.html"
  status = 200
