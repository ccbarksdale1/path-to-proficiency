<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Path to Proficiency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: adventure theme. Students climb a trail of standards to the summit; teacher pages stay clean and data-first.
   --blue is the primary action color (Forest Green); --blue-soft is Sky Blue. */
:root{
  --paper:#F2F9FE; --card:#FFFDF8; --ink:#16243B; --soft:#56657A; --rule:#D3E2EC; --margin:#F2B8A8;
  --blue:#176B45; --blue-soft:#DDF3FF; --hl:#FFD166; --hl-ink:#2A1E00;
  --go:#1A7D50; --go-soft:#DFF3E8; --oops:#C8463B; --oops-soft:#FCE6E2; --star:#D9971A;
  --gold:#FFD166; --gold-ink:#6B4A00; --purple:#E8DEFF; --purple-ink:#56399E; --sky:#DDF3FF;
  --mtn1:#176B45; --mtn2:#7FB79A; --snow:#FFFFFF;
  --fig-bg:#FFFFFF; --fig-ink:#1C2838;
  --body:"Lexend",system-ui,sans-serif; --display:"Fredoka","Lexend",system-ui,sans-serif; --hand:"Patrick Hand","Comic Sans MS",cursive;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1822; --card:#16222F; --ink:#E8EEF5; --soft:#9DB0C2; --rule:#29394A; --margin:#7A4038;
  --blue:#5FD39B; --blue-soft:#163248; --hl:#F2C14E; --hl-ink:#241900;
  --go:#5FD39B; --go-soft:#143A2A; --oops:#F07B70; --oops-soft:#3B201E; --star:#F2C14E;
  --gold:#F2C14E; --gold-ink:#2A1E00; --purple:#2D2547; --purple-ink:#CDBBFF; --sky:#163248;
  --mtn1:#2E8F62; --mtn2:#1F5A44; --snow:#E8EEF5; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1822; --card:#16222F; --ink:#E8EEF5; --soft:#9DB0C2; --rule:#29394A; --margin:#7A4038;
  --blue:#5FD39B; --blue-soft:#163248; --hl:#F2C14E; --hl-ink:#241900;
  --go:#5FD39B; --go-soft:#143A2A; --oops:#F07B70; --oops-soft:#3B201E; --star:#F2C14E;
  --gold:#F2C14E; --gold-ink:#2A1E00; --purple:#2D2547; --purple-ink:#CDBBFF; --sky:#163248;
  --mtn1:#2E8F62; --mtn2:#1F5A44; --snow:#E8EEF5; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:16px 40px}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2;font-family:var(--display)}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:600} h3{font-size:1.05rem;font-weight:600}
.teach h2,.teach h3{font-family:var(--body);font-weight:700}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:40px;height:40px;flex:none;display:block}
.brand small{display:block;color:var(--soft);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;background:var(--blue);color:var(--card);font-weight:700;transition:transform .08s ease,filter .15s ease}
button:not(:disabled):hover{filter:brightness(1.08)} button:not(:disabled):active{transform:translateY(1px) scale(.99)}
button.ghost{background:transparent;color:var(--blue);border:2px solid var(--rule)}
button.small{padding:6px 12px;font-size:.85rem}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,.tok:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 1px 0 var(--rule),0 6px 24px -14px rgba(20,40,80,.25);display:flex;flex-direction:column;gap:14px}
.notebook{background:var(--card);border:2px solid var(--rule);padding:20px 20px;border-radius:var(--r);display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 20px -16px rgba(20,40,80,.4)}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:500}
.note{font-family:var(--hand);font-size:1.3rem;line-height:1.35;color:var(--blue)}
.muted{color:var(--soft)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars{color:var(--star);font-weight:800}
.qtext{font-size:1.2rem;line-height:2.1;margin:0}
.eq{font-size:1.6rem;font-weight:700;letter-spacing:.02em}
.tok{display:inline;padding:2px 3px;border-radius:5px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tok.hl{background:var(--hl);color:var(--hl-ink)}
.tok.miss{text-decoration:underline wavy var(--oops) 2px;text-underline-offset:6px}
.tok.hit{background:var(--hl);color:var(--hl-ink);box-shadow:inset 0 -3px 0 var(--go)}
.ro .tok{cursor:default}
.box{display:inline-block;width:1em;height:1em;border:2px solid currentColor;vertical-align:-.12em;border-radius:2px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.9em;margin:0 2px}
.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 3px 1px}
.frac>span:last-child{padding:1px 3px 0}
.fig{background:var(--fig-bg);color:var(--fig-ink);border-radius:10px;padding:10px;display:inline-flex;justify-content:center;max-width:100%;overflow-x:auto}
.fig img{display:block;max-width:100%;height:auto}
.fig svg{display:block;max-width:100%;height:auto}
table.qt{border-collapse:collapse;font-size:1rem;background:var(--fig-bg);color:var(--fig-ink)}
table.qt th,table.qt td{border:1.5px solid var(--fig-ink);padding:6px 12px;text-align:center;vertical-align:middle}
table.qt th{font-weight:700}
.tw{overflow-x:auto;max-width:100%}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);color:var(--ink);border:2px solid var(--rule);font-size:1.05rem;font-weight:500;padding:12px;min-width:0}
.choice>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.choice b.l{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--rule);font-size:.95rem}
.choice.sel{border-color:var(--blue);background:var(--blue-soft)}
.choice.right{border-color:var(--go);background:var(--go-soft)}
.choice.wrong{border-color:var(--oops);background:var(--oops-soft)}
.choice:disabled{opacity:1;cursor:default}
.matrix{border-collapse:collapse;width:100%;max-width:440px}
.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--rule);text-align:center}
.matrix td:first-child{font-weight:700;font-size:1.2rem;text-align:left}
.matrix input{width:22px;height:22px;accent-color:var(--blue)}
.matrix td.right{background:var(--go-soft)} .matrix td.wrong{background:var(--oops-soft)}
input.num{font:inherit;font-size:1.4rem;width:120px;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:10px;padding:8px 12px}
.fb{border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.fb.go{background:var(--go-soft)} .fb.oops{background:var(--oops-soft)} .fb.info{background:var(--blue-soft)}
.streak{display:flex;gap:8px;align-items:center}
.streak i{width:16px;height:16px;border-radius:50%;border:2px solid var(--go)}
.streak i.on{background:var(--go)}
.steps-bar{display:flex;gap:6px}
.steps-bar span{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps-bar span.on{background:var(--blue)}
.stage{background:var(--fig-bg);color:var(--fig-ink);border-radius:12px;padding:16px;min-height:140px;display:grid;place-items:center;overflow-x:auto}
.colwork{font-family:ui-monospace,Menlo,monospace;font-size:1.8rem;font-variant-numeric:tabular-nums;border-collapse:collapse}
.colwork td{min-width:1.3em;text-align:center;padding:0 3px}
.colwork .carry td{font-size:1rem;color:#C0392B;height:1.2em}
.colwork .line td{border-top:3px solid currentColor}
.colwork s{opacity:.55} .colwork sup{color:#C0392B;font-size:.95rem}
.dots{display:flex;flex-direction:column;gap:6px}
.dots .r{display:flex;gap:6px}
.dots i,.grp i{width:14px;height:14px;border-radius:50%;background:#2B59C3;display:block}
.grps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}
.grp{border:2px solid #1C2838;border-radius:50%;width:64px;height:64px;display:flex;flex-wrap:wrap;gap:3px;align-content:center;justify-content:center;padding:6px}
.grp i{width:10px;height:10px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.chain span{padding:4px 10px;border-radius:8px;background:#E3EBFA}
.chain em{font-style:normal;color:#C0392B}
.say{font-size:1.1rem}
/* trail: summit at the top, start at the bottom (DOM order stays start → summit) */
.trail{display:flex;flex-direction:column-reverse;gap:0;list-style:none;padding:0;margin:0;position:relative}
.stop{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-radius:16px;position:relative;margin-block:4px}
.stop:nth-child(4n+2){margin-left:22px} .stop:nth-child(4n+3){margin-left:44px} .stop:nth-child(4n){margin-left:22px}
.stop::after{content:"";position:absolute;left:39px;top:-14px;height:18px;border-left:3px dashed var(--mtn2)}
.stop:last-child::after{display:none}
.stop .num{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--display);font-size:1.4rem;background:var(--card);border:3px solid var(--rule);color:var(--soft)}
.stop.done .num{background:var(--go);border-color:var(--go);color:var(--card)}
.stop.now{background:var(--sky);box-shadow:inset 0 0 0 2px var(--blue)}
.stop.now .num{background:var(--gold);border-color:var(--star);color:var(--gold-ink)}
.stop.later .num{opacity:.75}
.stop.summit .num{background:var(--purple);border-color:var(--purple-ink);color:var(--purple-ink)}
.stop.summit.reached .num{background:var(--gold);border-color:var(--star);color:var(--gold-ink)}
.stop .name{font-weight:700}
.pill{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card);white-space:nowrap;border:1px solid var(--rule)}
.pill.go{background:var(--go-soft);color:var(--go);border-color:transparent} .pill.now{background:var(--blue);color:var(--card);border-color:transparent} .pill.oops{background:var(--oops-soft);color:var(--oops);border-color:transparent}
.pill.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent} .pill.purple{background:var(--purple);color:var(--purple-ink);border-color:transparent}
.code-dots{display:flex;gap:14px;justify-content:center}
.code-dots span{width:46px;height:56px;border-radius:14px;border:3px solid var(--rule);background:var(--card);display:grid;place-items:center}
.code-dots span.on{border-color:var(--blue)} .code-dots span.on::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto;width:100%}
.pad button{font-size:1.5rem;padding:16px 0;background:var(--sky);color:var(--ink);font-family:var(--display)}
.pad button[data-n="go"]{background:var(--blue);color:var(--card)}
.err{color:var(--oops);min-height:1.5em}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:2px solid var(--rule)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table.roster{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.roster th{text-align:left;font-weight:500;color:var(--soft);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;padding:8px;border-bottom:2px solid var(--rule)}
.roster td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
.bar{display:inline-block;width:60px;height:8px;background:var(--rule);border-radius:4px;vertical-align:middle;overflow:hidden}
.bar span{display:block;height:100%}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--soft)}
label.f input,select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:10px;padding:9px 10px;min-width:0}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.qnav button{padding:8px 0;background:var(--paper);color:var(--ink);border:2px solid var(--rule);font-size:.9rem}
.qnav button[aria-pressed="true"]{background:var(--blue);color:var(--card);border-color:var(--blue)}
ol.bd{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:12px}
.why-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.why-list li{padding:8px 12px;border-radius:10px;background:var(--oops-soft)}
.land{gap:16px;padding-block:28px}
.hero{font-size:clamp(1.6rem,5vw,2.3rem);font-weight:800;letter-spacing:-.02em;max-width:20ch}
.lead{font-size:1.1rem;color:var(--soft);max-width:55ch}
ol.how{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;max-width:62ch}
button.link{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;font-weight:700}
a.btnlink{display:inline-block;padding:10px 16px;border-radius:12px;border:2px solid var(--blue-soft);color:var(--blue);font-weight:700;text-decoration:none}
.tag{font-size:.85rem;font-weight:700;align-self:flex-start;padding:2px 8px;border-radius:99px;background:var(--card)}
.tag.ok{color:var(--go)} .tag.no{color:var(--oops)}
.matrix .mk{font-size:.95rem}
.goal{display:flex;gap:28px;flex-wrap:wrap}
.goal>div{display:flex;flex-direction:column}
.goal .big{font-size:2.2rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.meter{position:relative;height:14px;border-radius:7px;background:var(--rule)}
.meter span{display:block;height:100%;border-radius:7px;background:var(--go)}
.meter i{position:absolute;top:-5px;bottom:-5px;width:3px;background:var(--ink);border-radius:2px;transform:translateX(-1px)}
/* adventure pieces */
.art{background:var(--sky);border-radius:var(--r);overflow:hidden;line-height:0}
.art svg{width:100%;height:auto;display:block}
.land .hero-row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:620px){.land .hero-row{grid-template-columns:1fr}}
.kicker{font-family:var(--display);font-weight:600;color:var(--blue);font-size:1.05rem}
.mission{background:linear-gradient(180deg,var(--sky),var(--card) 70%);border:2px solid var(--blue-soft)}
.mission .skill{display:flex;gap:14px;align-items:center}
.ico{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;background:var(--purple);color:var(--purple-ink);font-family:var(--display);font-weight:700;font-size:1.6rem;line-height:1}
.ico svg{width:28px;height:28px}
.stop .ico{width:40px;height:40px;border-radius:12px;font-size:1.2rem}
.stop .ico svg{width:22px;height:22px}
.scout{display:flex;gap:10px;align-items:flex-end}
.scout svg{width:56px;height:56px;flex:none}
.bubble{position:relative;background:var(--card);border:2px solid var(--rule);border-radius:16px;padding:10px 14px;font-family:var(--display);font-weight:500;font-size:1.1rem;color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:14px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--rule);border-bottom:2px solid var(--rule);transform:rotate(45deg)}
.flags{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sayb{display:inline-flex;align-items:center;gap:6px}
.flags i{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;border:2px solid var(--rule);background:var(--card);font-style:normal;font-size:.8rem;font-weight:700;color:var(--soft)}
.flags i.on{background:var(--gold);border-color:var(--star);color:var(--gold-ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;border:2px dashed var(--rule);min-width:0}
.badge .medal{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.2rem;background:var(--rule);color:var(--soft)}
.badge.got{border-style:solid;border-color:var(--gold);background:var(--card)}
.badge.got .medal{background:var(--gold);color:var(--gold-ink);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--star)}
.badge b{display:block;font-size:.9rem} .badge span{font-size:.78rem;color:var(--soft)}
.newbadge{display:flex;gap:10px;align-items:center;background:var(--purple);color:var(--purple-ink);border-radius:14px;padding:10px 14px;font-weight:700}
.newbadge .medal{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--gold-ink);font-family:var(--display)}
.meter i{background:var(--purple-ink)}
.burst{position:relative;display:inline-grid;place-items:center;width:30px;height:30px;vertical-align:middle;margin-right:6px}
.burst::before{content:"★";color:var(--star);font-size:28px;line-height:1;animation:burst .6s cubic-bezier(.3,1.6,.5,1) both}
.burst::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px dotted var(--star);animation:ring .6s ease-out both}
@keyframes burst{from{transform:scale(.2) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{from{transform:scale(.4);opacity:1}to{transform:scale(1.4);opacity:0}}
.attn{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.attn li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--oops-soft)}
.attn li p{grid-column:1/-1;font-size:.9rem}
.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
@media (max-width:520px){.choices{grid-template-columns:1fr}.qtext{font-size:1.1rem}h1{font-size:1.35rem}.eq{font-size:1.35rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- classes, compare, tests, tutor ---- */
.clist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cls{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px;border:2px solid var(--rule);border-radius:14px;background:var(--paper)}
textarea{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box;resize:vertical}
label.f textarea{font-size:1rem}
label.chk{display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--ink)}
label.chk input{width:20px;height:20px;accent-color:var(--blue)}
label.f.chk{justify-content:flex-end;padding-bottom:10px}
label.filebtn{display:inline-block;cursor:pointer;padding:10px 16px;border-radius:12px;border:2px solid var(--rule);color:var(--blue);font-weight:700}
label.filebtn:focus-within{outline:3px solid var(--blue);outline-offset:2px}
.figd{border:2px dashed var(--rule);border-radius:12px;padding:10px 14px;color:var(--soft);font-size:1rem;background:var(--paper)}
.dq{border-left:6px solid var(--rule)}
.dq.solved{border-left-color:var(--purple-ink)}
.dq.need{border-left-color:var(--oops)}
.dqg{display:grid;gap:10px;align-items:end;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
table.cmp td,table.cmp th{white-space:nowrap}
table.cmp td:first-child{white-space:normal;min-width:150px}
tr.tgrp td{background:var(--paper);border-top:2px solid var(--rule)}
tr.tot td{border-top:2px solid var(--ink);font-weight:700}
.hc{display:inline-block;min-width:3.2em;text-align:center;padding:3px 8px;border-radius:8px;font-weight:700;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);box-shadow:inset 3px 0 0 var(--c)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr) 3.2em;gap:10px;align-items:center;font-size:.9rem}
.hb .hl2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{position:relative;height:16px;border-radius:8px;background:var(--rule)}
.hb .track>span{display:block;height:100%;border-radius:8px;background:var(--go)}
.hb .track>i{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--purple-ink);transform:translateX(-1px)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:560px){.hb{grid-template-columns:1fr 3.2em}.hb .hl2{grid-column:1/-1}}
.chat{border:2px solid var(--blue-soft)}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;padding:4px}
.msgs .scout svg{width:40px;height:40px}
.msgs .bubble{font-family:var(--body);font-weight:400;font-size:1.05rem}
.msgs .me{display:flex;justify-content:flex-end}
.msgs .me span{background:var(--blue);color:var(--card);padding:8px 14px;border-radius:16px 16px 4px 16px;max-width:80%;font-size:1.05rem}
button.link.small{font-size:.9rem;text-decoration:none}
.dotty{display:inline-flex;gap:4px}
.dotty i{width:8px;height:8px;border-radius:50%;background:var(--soft);animation:dot 1s infinite ease-in-out}
.dotty i:nth-child(2){animation-delay:.15s}.dotty i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.3;transform:none}40%{opacity:1;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.dotty i{animation:none}}
</style>

function signin(){
  const teacherMode=S.mode==="teacher",max=teacherMode?6:4,dev=ls.get(CKEY);
  app.innerHTML=header(`<button class="ghost" id="back">Back</button>`)+`<div class="card" style="text-align:center">

   <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}<button data-n="back" aria-label="Delete">⌫</button><button data-n="0">0</button><button data-n="go">Go</button></div>
   <p class="err" role="alert">${esc(S.err)}</p>
   ${teacherMode?`<p class="muted" style="font-size:.85rem">Forgot your code? <button class="link" id="forgot">Reset it</button></p>`:`<p class="muted" style="font-size:.85rem">Not your class? <button class="link" id="chg">Change class</button></p>`}</div>`;

  const chg=document.getElementById("chg");if(chg)chg.onclick=()=>{S.screen="joinclass";S.join="";S.err="";render()};
  const fg=document.getElementById("forgot");if(fg)fg.onclick=()=>{S.screen="recover";S.err="";render()};
  app.querySelectorAll(".pad button").forEach(b=>b.onclick=async()=>{const n=b.dataset.n;S.err="";
    if(n==="back")S.code=S.code.slice(0,-1);
    else if(n==="go"){const code=S.code;S.code="";
      if(code.length<4){S.err=teacherMode?"Teacher codes have 4 to 6 digits.":"Your code has 4 digits.";render();return}
      app.querySelectorAll(".pad button").forEach(x=>x.disabled=true);

function topUp(sk,id,n=4){
  if(TESTID==="a1"){while(sk.queue.length<n)sk.queue.push(genId(id));return}
  const k=SKILLS.find(x=>x.id===id),pool=[...k.twins,...k.qs.map(n=>"q"+n)].filter(getQ);if(!pool.length)return;
  let guard=0;while(sk.queue.length<n&&guard++<50){const c=pool.filter(x=>!sk.queue.includes(x)),from=c.length?c:pool;sk.queue.push(from[Math.floor(Math.random()*from.length)])}
}
function newQ(){const k=curSkill(S.student),sk=S.student.prog.skills[k.id];
  while(sk.queue.length&&!getQ(sk.queue[0]))sk.queue.shift(); topUp(sk,k.id);
  S.k=k.id;S.qid=sk.queue[0];S.q=viewQ(getQ(S.qid));S.step=1;S.hl=new Set();S.sel=[];S.result=null;S.r=0;S.full=false;S.mastered=false;S.chat=null;stopPlay()}

function answerArea(q){
  const done=!!S.result;
  if(q.type==="mc"||q.type==="multi"){
    const one=q.choices.some(c=>typeof c==="string"&&c.length>40)||q.choices.some(c=>c.table);
    const need=q.type==="multi"?2:1;
    return `<p class="note">${q.type==="multi"?'Pick TWO answers, then tap Check.':'Pick your answer, then tap Check.'}</p>
     <div class="choices${one?' one':''}">${q.choices.map((c,i)=>{const l=L[i];let cl="",tag="";
      const isAns=q.type==="mc"?q.ans===l:q.ans.includes(l);
      if(done){if(isAns){cl=" right";tag=`<span class="tag ok">✓ Right answer</span>`}else if(S.sel.includes(l)){cl=" wrong";tag=`<span class="tag no">✗ Your answer</span>`}}
      else if(S.sel.includes(l))cl=" sel";
      return `<button class="choice${cl}" data-l="${l}" ${done?'disabled':''} aria-pressed="${S.sel.includes(l)}"><b class="l">${l}</b><div>${choiceInner(c)}${tag}</div></button>`}).join("")}</div>
     ${!done?`<button id="check" ${S.sel.length!==need?'disabled':''}>${need===2?"Check my answers":"Check my answer"}</button>`:''}`;
  }
  if(q.type==="input") return `<div class="row"><label class="f" style="font-size:1rem;color:var(--ink)">Your answer<input class="num" id="num" inputmode="decimal" ${done?'disabled':''} value="${esc(S.sel[0]||"")}"></label>${done?"":'<button id="check">Check my answer</button>'}</div>`;
  if(q.type==="matrix") return `<table class="matrix"><thead><tr><th></th>${q.cols.map(c=>`<th>Rounds to ${c}</th>`).join("")}</tr></thead><tbody>
    ${q.rows.map((r,i)=>`<tr><td>${r.n}</td>${q.cols.map(c=>{let cl="",mk="";if(done&&S.sel[i]===c){cl=c===r.a?"right":"wrong";mk=c===r.a?" ✓":" ✗"}else if(done&&c===r.a){cl="right";mk=" ✓"}
      return `<td class="${cl}"><input type="radio" name="m${i}" id="m${i}-${c}" value="${c}" ${S.sel[i]===c?'checked':''} ${done?'disabled':''} aria-label="${r.n} rounds to ${c}"><b class="mk">${mk}</b></td>`}).join("")}</tr>`).join("")}</tbody></table>
    ${done?"":`<button id="check" ${q.rows.every((_,i)=>S.sel[i])?'':'disabled'}>Check my answers</button>`}`;
}

/* ---------- Scout, the AI tutor ---------- */
const tutorOn=()=>!S.demo&&S.role==="student"&&SB&&SB.ai&&SB.cls.tutor!==false;
function chatHTML(){
  if(!tutorOn())return"";
  const c=S.chat;
  if(!c||!c.open)return `<div class="row"><button class="ghost" id="ask">💬 Ask Scout for help</button></div>`;
  const chips=S.result==="wrong"?["Why was my answer wrong?","Can you show me another way?","I still don’t get it."]
    :S.result==="right"?["Why does this work?","Give me a harder one to think about."]
    :["What is this question asking?","Give me a hint.","What should I do first?"];
  return `<div class="card chat pop" aria-label="Chat with Scout">
   <div class="top"><h3>Ask Scout</h3><button class="ghost small" id="chat-x">Close</button></div>
   <div class="msgs" id="msgs" aria-live="polite">
    ${scout("Hi! I’m Scout. I can give you hints. Ask me anything about this question!")}
    ${c.msgs.map((m,i)=>m.role==="user"?`<div class="me"><span>${esc(m.content)}</span></div>`:`${scout(esc(m.content)+(TTS?` <button class="link small sayc" data-i="${i}" aria-label="Read this to me">🔊</button>`:""))}`).join("")}
    ${c.busy?scout('<span class="dotty" aria-label="Scout is thinking"><i></i><i></i><i></i></span>'):""}
   </div>
   ${c.err?`<p class="err" role="alert">${esc(c.err)}</p>`:""}
   <div class="row">${chips.map(t=>`<button class="ghost small chip" ${c.busy?"disabled":""}>${esc(t)}</button>`).join("")}</div>
   <form id="chat-f" class="row"><input id="chat-in" maxlength="300" placeholder="Type your question" autocomplete="off" style="flex:1;min-width:160px;font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--rule);border-radius:10px;padding:10px 12px" aria-label="Your question for Scout"><button type="submit" ${c.busy?"disabled":""}>Send</button></form>
  </div>`;
}
function wireChat(){
  const ask=document.getElementById("ask");if(ask)ask.onclick=()=>{S.chat={open:true,msgs:[],busy:false};render();document.getElementById("chat-in")?.focus()};
  if(!S.chat||!S.chat.open)return;
  document.getElementById("chat-x").onclick=()=>{S.chat.open=false;render()};
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>sendChat(b.textContent));
  app.querySelectorAll(".sayc").forEach(b=>b.onclick=()=>{stopPlay();speak(S.chat.msgs[+b.dataset.i].content)});
  document.getElementById("chat-f").onsubmit=e=>{e.preventDefault();const v=document.getElementById("chat-in").value.trim();if(v)sendChat(v)};
  const m=document.getElementById("msgs");if(m)m.scrollTop=m.scrollHeight;
}
async function sendChat(text){
  const c=S.chat;if(c.busy)return;c.msgs.push({role:"user",content:text});c.busy=true;c.err="";render();
  const q=S.q,k=SKILLS.find(x=>x.id===S.k);
  const qd={parts:q.parts.map(p=>p.img?{img:1,alt:ALT[p.img]||"a picture from the test"}:p),choices:(q.choices||[]).map(ch=>ch&&ch.img?{alt:(ALT[ch.img]||"a picture").replace(/^Choice [A-E]: /,""),eq:ch.eq}:ch),
    ans:q.type==="matrix"?q.rows.map(r=>`${r.n} → ${r.a}`).join(", "):q.ans,type:q.type,steps:q.steps,std:k&&k.std,skillName:k&&k.name};
  if(q.type==="matrix")qd.parts=[...q.parts,"Rows: "+q.rows.map(r=>r.n).join(", ")+". Columns: "+q.cols.join(", ")];
  try{const d=await api("tutor",{q:qd,testId:TESTID,picked:S.sel.join(" and "),result:S.result,messages:c.msgs,grade:ACT?.grade||"3"});
    c.msgs.push({role:"assistant",content:d.reply})}
  catch(e){c.err=e.message;c.msgs.pop()}
  c.busy=false;if(S.screen==="practice"&&S.chat===c){render();document.getElementById("chat-in")?.focus()}
}

function practice(){
  const s=S.student,p=s.prog,k=SKILLS.find(x=>x.id===S.k),sk=p.skills[k.id],q=S.q,MASTERY=MAST();
  const nKeys=q.keys.length,found=foundKeys(q,S.hl).size;
  let below="";
  if(S.step===1) below=`<div class="card pop"><p class="note">Step 1: Tap your key words. Highlight the numbers and the words that tell you what to do.</p>
     <div class="row"><button id="done1" ${S.hl.size<2?'disabled':''}>I found my key words</button><span class="muted">${S.hl.size} highlighted</span></div></div>`;
  else below=`<div class="card pop">
     ${S.step===2&&!S.result?`<div class="fb info"><p><b>You found ${found} of ${nKeys} key words.</b> ${found<nKeys?'The wavy lines show the ones you missed. Read them again.':'Great reading!'}</p></div>
     <p class="note">Step 2: Solve it. Work it out with your pencil, then answer.</p>`:''}
     ${answerArea(q)}${S.result?feedback(q):''}</div>`;
  app.innerHTML=header(`<button class="ghost" id="back">My trail</button>`)+`
   <div class="row" style="justify-content:space-between"><span class="label">${esc(k.std)} · ${esc(k.name)}</span>
    <span class="flags" aria-label="Checkpoint progress: ${sk.streak} of ${MASTERY} in a row"><span class="muted" style="font-size:.85rem;margin-right:4px">Checkpoint</span>${Array.from({length:MASTERY},(_,i)=>`<i class="${i<sk.streak?'on':''}">${i<sk.streak?'★':i+1}</i>`).join("")}</span></div>
   <div class="steps-bar"><span class="on"></span><span class="${S.step>1?'on':''}"></span><span class="${S.result?'on':''}"></span></div>
   <div class="notebook ${S.step>1?'ro':''}"><div class="row" style="justify-content:space-between"><span class="label">${qLabel(S.qid)}</span>${sayBtn("say-q")}</div>${bodyHTML(q,S.hl,S.step===1?"tap":"check")}</div>${below}${chatHTML()}`;
  document.getElementById("back").onclick=()=>{stopPlay();S.screen="home";render()};
  wireChat();
  const sq=document.getElementById("say-q"); if(sq) sq.onclick=()=>{stopPlay();speak(S.step===1?q.parts.map(p=>typeof p==="string"?p:p.eq||p.fig||"").join(". "):qSpeech(q))};
  if(S.step===1){
    app.querySelectorAll(".tok").forEach(el=>{const f=()=>{const i=+el.dataset.t;S.hl.has(i)?S.hl.delete(i):S.hl.add(i);render()};el.onclick=f;el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}}});
    document.getElementById("done1").onclick=()=>{S.step=2;S.shownAt=Date.now();render()};return;
  }
  if(!S.result){
    if(q.type==="mc"){app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{S.sel=[b.dataset.l];render()});
      document.getElementById("check").onclick=()=>grade(q)}
    if(q.type==="multi"){app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const l=b.dataset.l;S.sel=S.sel.includes(l)?S.sel.filter(x=>x!==l):[...S.sel,l].slice(-2);render()});
      document.getElementById("check").onclick=()=>grade(q)}
    if(q.type==="input"){const n=document.getElementById("num");n.oninput=()=>S.sel=[n.value.trim()];n.onkeydown=e=>{if(e.key==="Enter"&&n.value.trim())grade(q)};
      document.getElementById("check").onclick=()=>{if(n.value.trim())grade(q)}}
    if(q.type==="matrix"){app.querySelectorAll(".matrix input").forEach(r=>r.onchange=()=>{const i=+r.name.slice(1);S.sel[i]=r.value;render()});
      document.getElementById("check").onclick=()=>grade(q)}
  } else wireFeedback(q);
}

function isRight(q){
  if(q.type==="mc")return S.sel[0]===q.ans;
  if(q.type==="multi")return S.sel.length===2&&q.ans.every(a=>S.sel.includes(a));
  if(q.type==="input")return Number(String(S.sel[0]).replace(/,/g,""))===Number(q.ans);
  return q.rows.every((r,i)=>S.sel[i]===r.a);
}
function grade(q){
  const s=S.student,p=s.prog,k=SKILLS.find(x=>x.id===S.k),sk=p.skills[k.id],ok=isRight(q);
  S.result=ok?"right":"wrong"; S.fast=(Date.now()-S.shownAt)<5000;
  const lg=p.log[S.qid]||(p.log[S.qid]={tries:0,right:0,first:null}); S.newBadges=[];
  if(ok&&lg.tries>lg.right) award(p,"persist"); // right on a question they missed before
  lg.tries++; if(ok)lg.right++; if(lg.first===null)lg.first=ok;
  if(ok) award(p,"first");
  (p.recent=p.recent||[]).push({k:k.id,q:S.qid,ok}); if(p.recent.length>30)p.recent.shift();
  p.last=Date.now();
  if(sk.queue[0]===S.qid)sk.queue.shift();
  if(ok){sk.streak++;p.stars++}
  else{sk.streak=0;topUp(sk,k.id,3);sk.queue.splice(3,0,S.qid)} // comes back after 3 other questions, with the choices in a new order
  S.mastered=ok&&sk.streak>=MAST();
  if(S.mastered){sk.status="done";p.stars+=5;award(p,"trail");if(!curSkill(s))award(p,"summit")} // counts right away, even if they leave this page
  save(); render();
}
function whyText(q){
  if(q.type==="mc")return fmt(q.why?.[S.sel[0]]||"Look at the breakdown below to see how to solve it.");
  if(q.type==="multi"){const wrong=S.sel.filter(l=>!q.ans.includes(l));const out=wrong.map(l=>`${l}: ${fmt(q.why?.[l]||"This one does not fit.")}`);
    if(S.sel.length<2)out.push("Remember to pick two answers.");if(!wrong.length)out.push("Check each choice again.");return out.join("<br>")}
  if(q.type==="input")return fmt((q.whyIn&&q.whyIn[String(Number(S.sel[0]))])||q.whyElse||"Look at the breakdown below to see how to solve it.");
  const i=q.rows.findIndex((r,j)=>S.sel[j]!==r.a);return fmt(q.rows[i].why);
}
function stepsPlayer(q){
  const steps=q.steps; let show="";for(let i=S.r;i>=0;i--){if(steps[i].show){show=showHTML(steps[i].show);break}}
  return `<div class="row" style="justify-content:space-between"><h3>Watch the breakdown</h3><span class="muted">Step ${S.r+1} of ${steps.length}</span></div>
   ${show?`<div class="stage" aria-live="polite">${show}</div>`:''}<p class="say">${fmt(steps[S.r].say)}</p>
   <div class="row"><button class="ghost small" id="prev" ${S.r===0?'disabled':''}>Back</button><button class="ghost small" id="play">${S.playing?'Pause':TTS?'▶ Play and read':'▶ Play'}</button><button class="ghost small" id="fwd" ${S.r===steps.length-1?'disabled':''}>Next step</button>${sayBtn("say-step","🔊 Read this step")}</div>`;
}
function feedback(q){
  const sk=S.student.prog.skills[S.k],vid=db.videos[q.skill],MASTERY=MAST();
  const nb=(S.newBadges||[]).map(id=>BADGES.find(b=>b.id===id)).map(b=>`<div class="newbadge pop"><span class="medal" aria-hidden="true">${b.m}</span>New badge: ${b.name}!</div>`).join("");
  if(S.result==="right") return `<div class="fb go"><p style="display:flex;align-items:center"><span class="burst" aria-hidden="true"></span><b>Yes! That’s right.</b>&nbsp;+1 star</p>
     <p class="note" style="color:var(--go)">${S.mastered?`That makes ${MASTERY} in a row. You reached the checkpoint!`:`${CHEERS[(sk.streak+Object.keys(S.student.prog.log).length)%CHEERS.length]} ${MASTERY-sk.streak} more in a row to reach the checkpoint.`}</p>${nb}
     ${S.full?stepsPlayer(q):`<button class="ghost small" id="see" style="align-self:flex-start">See the breakdown</button>`}
     <button id="next">${S.mastered?"See my badge":"Next question"}</button></div>`;
  return `${scout(S.fast?"Whoa, that was fast! Did you work it out, or guess? Let’s slow down and learn from this one.":"Mistakes help us climb. Let’s learn from this one.")}
   <div class="fb oops"><p><b>The answer is ${esc(ansText(q))}. Here’s what happened:</b></p><p>${whyText(q)}</p>${sayBtn("say-why","🔊 Read this to me")}</div>
   ${stepsPlayer(q)}
   ${vid?`<a href="${esc(vid)}" target="_blank" rel="noopener">Watch ${esc(TEACHER)}’s video on this skill</a>`:''}
   <button id="next">Try another one</button>`;
}
let timer=null; function stopPlay(){clearTimeout(timer);timer=null;S.playing=false;if(TTS)speechSynthesis.cancel()}
/* play the breakdown: each step is read aloud and the next one starts when the reading ends (6 seconds a step without a voice) */
function playFrom(q){if(!S.playing)return;render();const next=()=>{if(!S.playing)return;if(S.r<q.steps.length-1){S.r++;playFrom(q)}else{S.playing=false;render()}};
  if(TTS)speak(q.steps[S.r].say,()=>{if(S.playing)timer=setTimeout(next,600)});else timer=setTimeout(next,6000)}
function wireFeedback(q){
  document.getElementById("next").onclick=()=>{stopPlay();
    if(S.mastered){S.done=S.k;S.screen="mastered";render();return}
    newQ();render()};
  const sw=document.getElementById("say-why"); if(sw) sw.onclick=()=>{stopPlay();speak(`The answer is ${ansText(q)}. `+whyText(q).replace(/<br>/g,". "))};
  const ss=document.getElementById("say-step"); if(ss) ss.onclick=()=>{stopPlay();render();speak(q.steps[S.r].say)};
  const see=document.getElementById("see"); if(see) see.onclick=()=>{S.full=true;S.r=0;render()};
  const prev=document.getElementById("prev"); if(!prev) return;
  prev.onclick=()=>{stopPlay();S.r--;render()};
  document.getElementById("fwd").onclick=()=>{stopPlay();S.r++;render()};
  document.getElementById("play").onclick=()=>{if(S.playing){stopPlay();render();return}
    stopPlay();S.playing=true;if(S.r===q.steps.length-1)S.r=0;playFrom(q)};
}

/* ---------- CSV ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;
  const delim=(text.split("\n")[0].match(/\t/g)||[]).length>(text.split("\n")[0].match(/,/g)||[]).length?"\t":",";
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);
  return rows.map(r=>r.map(x=>x.trim()));
}
function parseScores(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error("The file needs a header row and at least one student.");
  const h=rows[0].map(x=>x.toLowerCase().replace(/[^a-z0-9#]/g,""));
  const ni=h.findIndex(x=>/^(name|student|studentname|firstname|first)$/.test(x));
  if(ni<0)throw new Error("I couldn’t find a Name column. Name the first column “Name”.");
  const ci=h.findIndex(x=>/^(code|secretcode|pin)$/.test(x)),mi=h.findIndex(x=>/^(missed|wrong|questionsmissed)$/.test(x));
  const qcols=h.map((x,i)=>{const m=x.match(/^(?:q|question|#)?(\d{1,3})$/);return m?{i,n:+m[1]}:null}).filter(Boolean).filter(c=>c.i!==ci);
  if(mi<0&&!qcols.length)throw new Error("Add a “Missed” column, or one column per question named 1, 2, 3…");
  const warn=[],out=[];
  for(const r of rows.slice(1)){const name=(r[ni]||"").trim();if(!name)continue;
    let code=ci>=0?(r[ci]||"").replace(/\D/g,""):"";if(code&&code.length!==4){warn.push(`${name}: code “${r[ci]}” is not 4 digits, so a new one will be made.`);code=""}
    let missed;
    if(mi>=0&&(r[mi]||"").trim()!=="")missed=parseMissed(r[mi]);
    else if(qcols.length){missed=[];let any=false;
      for(const c of qcols){const v=(r[c.i]||"").trim(),q=Object.values(QSA).find(x=>x.n===c.n);if(v==="")continue;any=true;
        let right;
        if(/^(1|y|yes|true|correct|right|✓|x)$/i.test(v))right=true;
        else if(/^(0|n|no|false|incorrect|wrong|✗)$/i.test(v))right=false;
        else if(q&&q.type==="mc")right=v.toUpperCase()===q.ans;
        else if(q&&q.type==="multi")right=[...v.toUpperCase().replace(/[^A-E]/g,"")].sort().join("")===[...q.ans].sort().join("");
        else if(q&&q.type==="input")right=Number(v.replace(/,/g,""))===Number(q.ans);
        else {warn.push(`${name}, question ${c.n}: couldn’t read “${v}”.`);continue}
        if(!right)missed.push(c.n)}
      if(!any)missed=null}
    else missed=null;
    const match=CUR.raw.find(s=>s.name.trim().toLowerCase()===name.toLowerCase());
    out.push({name,code,missed,match:match&&match.id});
  }
  if(!out.length)throw new Error("No students were found in the file.");
  return {rows:out,warn};
}

/* ---------- compare classes ---------- */
function classStats(entry){
  const studs=entry.students.map(viewStudent).filter(s=>!isSample(s)),N=studs.length;
  const finished=studs.filter(s=>!curSkill(s)).length;
  const withData=studs.filter(s=>s.missed),nq=qNums().length||1;
  const testAvg=withData.length?Math.round(withData.reduce((a,s)=>a+(1-s.missed.length/nq),0)/withData.length*100):null;
  let t=0,r=0,tut=0,active=0;const wk=Date.now()-7*864e5;
  studs.forEach(s=>{Object.values(s.prog.log).forEach(l=>{t+=l.tries;r+=l.right});tut+=s.prog.tutor?.total||0;if((s.prog.last||0)>wk)active++});
  const std=SKILLS.map(k=>N?Math.round(studs.filter(s=>s.prog.skills[k.id].status!=="todo").length/N*100):null);
  const stdTest=SKILLS.map(k=>withData.length?Math.round(withData.reduce((a,s)=>a+(1-k.qs.filter(n=>s.missed.includes(n)).length/Math.max(1,k.qs.length)),0)/withData.length*100):null);
  return {cls:entry.cls,N,finished,fin:N?Math.round(finished/N*100):null,testAvg,acc:t?Math.round(r/t*100):null,answered:t,tut,active,std,stdTest,goal:entry.cls.goal};
}
function tCompare(){
  const tests=TB.tests.filter(t=>TB.classes.some(c=>c.testId===t.id));
  if(!TB.classes.length)return `<div class="card"><h2>Compare classes</h2><p class="muted">Make a class first.</p></div>`;
  if(!S.cmpTest||!tests.some(t=>t.id===S.cmpTest))S.cmpTest=(tests[0]||{id:"a1"}).id;
  const pick=`<div class="card"><h2>Compare classes</h2><p class="muted">${isAdmin()?"Every class in the school":"Your classes"} using the same test, side by side. Sample students are not counted.</p>
   <form class="grid" id="cmp-f"><label class="f">Test<select id="cmp-test">${tests.map(t=>`<option value="${t.id}" ${t.id===S.cmpTest?"selected":""}>${esc(t.name)} (${TB.classes.filter(c=>c.testId===t.id).length} classes)</option>`).join("")}</select></label>
   <label class="f">Group by<select id="cmp-g"><option value="t" ${S.cmpG!=="c"?"selected":""}>Teacher</option><option value="c" ${S.cmpG==="c"?"selected":""}>Class only</option></select></label></form></div>`;
  const D=S.cmp;
  if(!D||D.loading||D.test!==S.cmpTest)return pick+`<div class="card"><p class="muted">Loading classes…</p></div>`;
  if(D.err)return pick+`<div class="fb oops"><p>${esc(D.err)}</p></div>`;
  useTest(D.def);
  const st=D.data.map(classStats);
  const sum=list=>{const N=list.reduce((a,x)=>a+x.N,0),w=(f)=>{const xs=list.filter(x=>x[f]!=null&&x.N);const n=xs.reduce((a,x)=>a+x.N,0);return n?Math.round(xs.reduce((a,x)=>a+x[f]*x.N,0)/n):null};
    return {N,finished:list.reduce((a,x)=>a+x.finished,0),fin:N?Math.round(list.reduce((a,x)=>a+x.finished,0)/N*100):null,testAvg:w("testAvg"),acc:w("acc"),answered:list.reduce((a,x)=>a+x.answered,0),tut:list.reduce((a,x)=>a+x.tut,0),active:list.reduce((a,x)=>a+x.active,0),
      std:SKILLS.map((_,i)=>{const xs=list.filter(x=>x.std[i]!=null);const n=xs.reduce((a,x)=>a+x.N,0);return n?Math.round(xs.reduce((a,x)=>a+x.std[i]*x.N,0)/n):null}),
      stdTest:SKILLS.map((_,i)=>{const xs=list.filter(x=>x.stdTest[i]!=null);return xs.length?Math.round(xs.reduce((a,x)=>a+x.stdTest[i],0)/xs.length):null})}};
  const cell=v=>v==null?'<td class="muted">—</td>':`<td><span class="hc" style="--c:${heat(v)}">${v}%</span></td>`;
  const row=(x,label,sub,cls)=>`<tr class="${cls||""}"><td><b>${label}</b>${sub?`<br><span class="muted">${sub}</span>`:""}</td><td>${x.N}</td>${cell(x.testAvg)}${cell(x.fin)}${cell(x.acc)}<td>${x.answered}</td><td>${x.active}</td><td>${x.tut}</td></tr>`;
  let rows="";
  if(S.cmpG==="c")rows=st.map(x=>row(x,esc(x.cls.name),esc(tName(x.cls.teacherId)))).join("");
  else{const byT={};st.forEach(x=>(byT[x.cls.teacherId]=byT[x.cls.teacherId]||[]).push(x));
    rows=Object.entries(byT).map(([tid,list])=>row(sum(list),esc(tName(tid)),`${list.length} class${list.length===1?"":"es"}`,"tgrp")+list.map(x=>row(x,"&nbsp;&nbsp;"+esc(x.cls.name),"")).join("")).join("")}
  if(st.length>1)rows+=row(sum(st),"All classes","","tot");
  const bars=st.map(x=>`<div class="hb"><span class="hl2">${esc(x.cls.name)} <span class="muted">· ${esc(tName(x.cls.teacherId))}</span></span><span class="track"><span style="width:${x.fin||0}%"></span><i style="left:${x.goal}%" title="Goal ${x.goal}%"></i></span><b>${x.fin==null?"—":x.fin+"%"}</b></div>`).join("");
  const stdTable=`<div class="tablewrap"><table class="roster cmp"><thead><tr><th>Standard</th>${st.map(x=>`<th>${esc(x.cls.name)}<br><span style="text-transform:none">${esc(tName(x.cls.teacherId))}</span></th>`).join("")}${st.length>1?"<th>All</th>":""}</tr></thead><tbody>
    ${SKILLS.map((k,i)=>`<tr><td><b>${esc(k.std)}</b><br><span class="muted">${esc(k.name)}</span></td>${st.map(x=>cell(S.cmpM==="test"?x.stdTest[i]:x.std[i])).join("")}${st.length>1?cell(S.cmpM==="test"?sum(st).stdTest[i]:sum(st).std[i]):""}</tr>`).join("")}</tbody></table></div>`;
  return pick+`<div class="card"><h2>Class summary</h2>
   <div class="tablewrap"><table class="roster cmp"><thead><tr><th>${S.cmpG==="c"?"Class":"Teacher / class"}</th><th>Students</th><th>Test score</th><th>Finished path</th><th>Practice accuracy</th><th>Answered</th><th>Active this week</th><th>Asked Scout</th></tr></thead><tbody>${rows}</tbody></table></div>
   <p class="muted" style="font-size:.85rem">Test score is the average % right on ${esc(TEST_NAME)} for students whose scores you entered. Finished path means mastery on every standard they missed.</p></div>
   <div class="card"><h2>Finished their path</h2><p class="muted">The line on each bar is that class’s goal.</p><div class="hbars">${bars}</div></div>
   <div class="card"><div class="top"><h2>By standard</h2><div class="tabs" role="group" aria-label="Measure"><button class="small" data-m="prac" aria-pressed="${S.cmpM!=="test"}">Proficient now</button><button class="small" data-m="test" aria-pressed="${S.cmpM==="test"}">Right on the test</button></div></div>
    <p class="muted">${S.cmpM==="test"?"Average % right on each standard’s test questions.":"% of students who mastered the standard in practice or got it all right on the test."}</p>${stdTable}</div>`;
}

    for(let a=0;a<2;a++){try{const r=await api("aiPractice",{std:k.std,skill:k.name,examples:ex,n,grade:t.grade});
      const list=r.questions.map((x,i)=>cleanQ({...x,n:i+1})).filter(q=>q&&q.steps.length&&(q.type==="input"?q.ans!=="":q.type==="multi"?q.ans.length===2:q.ans))
        .map(q=>{const o={skill:k.id,type:q.type,parts:q.parts.filter(p=>!p.fig),keys:q.keys,steps:q.steps,why:q.why,ans:q.ans};if(q.type!=="input")o.choices=q.choices;else{o.whyElse=q.whyElse;o.whyIn=q.whyIn}return o});
      t.practice[k.id]=[...(t.practice[k.id]||[]),...list].slice(-30);break}catch(e){if(a)console.warn(e)}}
    done++;onProg(done,todo.length)});
}

  if(sess&&sess.token){TOKEN=sess.token;
    try{if(sess.role==="teacher"){startTeacher({token:TOKEN,...await api("boot")});return}
      else{startStudent({...await api("studentBoot"),token:TOKEN});return}}catch(e){TOKEN=null;ls.set(SKEY,null,sessionStorage)}}
  render();
})();
